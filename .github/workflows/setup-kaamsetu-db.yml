name: Setup KaamSetu database
# One-time: creates the Nearse tables/functions in the existing Supabase
# project. Reads the Supabase access token from the repo secret
# SUPABASE_TOKEN. Writes a sanitized status report to
# .github/kaamsetu-setup-status.txt (never the token). Removed after use.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/setup-kaamsetu-db.yml", "docs/supabase-workers-setup.sql"]

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Nearse SQL on Supabase
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          set -uo pipefail
          R=.github/kaamsetu-setup-status.txt
          note(){ echo "$1" | tee -a "$R"; }
          : > "$R"
          note "run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ -z "${SB_TOKEN:-}" ]; then
            note "ERROR: SUPABASE_TOKEN secret is empty or missing (check the secret name spelling)"
            exit 1
          fi
          note "secret: present (${#SB_TOKEN} chars)"
          echo "::add-mask::$SB_TOKEN"
          api=https://api.supabase.com/v1
          hdr=(-H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json")

          code=$(curl -sS -o /tmp/projects.json -w "%{http_code}" "${hdr[@]}" $api/projects)
          note "list projects: HTTP $code"
          if [ "$code" != "200" ]; then
            note "ERROR: token rejected or API unreachable. Body: $(head -c 300 /tmp/projects.json)"
            exit 1
          fi
          ref=$(jq -r '[.[] | select(.name=="budget-cars")][0].id // empty' /tmp/projects.json)
          if [ -z "$ref" ]; then
            note "ERROR: project 'budget-cars' not found. Projects: $(jq -r '[.[].name] | join(", ")' /tmp/projects.json)"
            exit 1
          fi
          note "project: $ref"

          jq -Rs '{query:.}' docs/supabase-workers-setup.sql > /tmp/q.json
          code=$(curl -sS -o /tmp/sql-out.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query -d @/tmp/q.json)
          note "run SQL: HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            note "ERROR running SQL: $(head -c 500 /tmp/sql-out.json)"
            exit 1
          fi

          code=$(curl -sS -o /tmp/count.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query \
            -d '{"query":"select count(*)::int as n from public.workers"}')
          note "verify workers table: HTTP $code — $(head -c 200 /tmp/count.json)"
          [ "$code" = "200" ] || [ "$code" = "201" ] || exit 1

          # confirm the migration actually shaped the schema, not just that the SQL parsed
          cat > /tmp/verify.sql <<'VSQL'
          select
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers'
                and column_name in ('status','phone_verified','review_note')) as new_worker_cols,
            (select count(*)::int from information_schema.routines
              where routine_schema='public'
                and routine_name in ('admin_set_status','admin_set_require_otp')) as new_functions,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers' and column_name='email') as email_leaked_to_public,
            (select require_phone_otp from public.nearse_config where id=1) as require_phone_otp,
            (select count(*)::int from public.workers where status='approved') as approved_now,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='worker_secrets'
                and column_name in ('email','wa_code')) as private_cols,
            (select count(*)::int from information_schema.routines
              where routine_schema='public' and routine_name='admin_wa_codes') as wa_fn,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers' and column_name='wa_code') as wa_code_leaked,
            (select count(*)::int from information_schema.routines
              where routine_schema='public' and routine_name='delete_worker') as delete_fn,
            (select count(*)::int from pg_trigger
              where tgname = 'workers_coarse_location_trg') as coarse_loc_trigger,
            (select count(*)::int from public.workers
              where lat is not null and lat <> round(lat::numeric, 3)::double precision) as precise_coords_left,
            (select count(*)::int from storage.buckets where id='selfies' and public) as selfie_bucket,
            (select file_size_limit from storage.buckets where id='selfies') as selfie_size_cap,
            (select count(*)::int from pg_policies
              where schemaname='storage' and tablename='objects'
                and policyname in ('selfies are publicly readable','anyone may upload a selfie')) as selfie_policies,
            (select count(*)::int from public.workers where selfie like 'data:%') as photos_still_in_db,
            (select count(*)::int from information_schema.routines
              where routine_schema='public' and routine_name='search_workers') as search_fn,
            (select count(*)::int from pg_indexes
              where schemaname='public' and indexname='workers_browse_idx') as browse_index,
            (select count(*)::int from public.search_workers(26.1445, 91.7362, null, null, null, 'Guwahati', 20, 0)) as search_page_rows,
            (select count(*)::int from public.workers where status='approved' and available) as approved_and_available,
            (select coalesce(string_agg(distinct encode(convert_to(coalesce(city,'~NULL~'),'UTF8'),'hex'), ' | '), '(none)')
               from public.workers) as cities_hex,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers' and column_name='thumb') as thumb_col,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers' and column_name in ('thumb','selfie')) as photo_cols,
            (select count(*)::int from public.service_rates) as rate_bands,
            (select min_price || '-' || max_price from public.service_rates where skill='Carpenter') as carpenter_band,
            (select count(*)::int from information_schema.routines
              where routine_schema='public' and routine_name='check_rate_bands') as band_fn,
            (select count(*)::int from public.workers w, jsonb_array_elements(w.skills) s
               join public.service_rates r on r.skill = s->>'skill'
              where (s->>'price')::numeric < r.min_price or (s->>'price')::numeric > r.max_price) as live_rates_out_of_band
          VSQL
          jq -Rs '{query: .}' /tmp/verify.sql > /tmp/v.json
          code=$(curl -sS -o /tmp/verify.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query -d @/tmp/v.json)
          note "verify migration: HTTP $code — $(head -c 900 /tmp/verify.json)"
          [ "$code" = "200" ] || [ "$code" = "201" ] || exit 1

          # Migration 10, checked against the real database rather than a
          # local copy. Every one of these was a way in before it was closed.
          cat > /tmp/harden.sql <<'HSQL'
          select
            (select public.pin_is_published(pin_hash) from public.nearse_admin where id=1)
              as admin_pin_STILL_PUBLISHED_change_it,
            (select public.pin_is_published(pin_hash) from public.owner_settings where id=1)
              as cars_pin_STILL_PUBLISHED_change_it,
            (select count(*)::int from pg_policies
              where schemaname='public' and tablename='workers'
                and qual like '%approved%') as workers_policy_approved_only,
            (select count(*)::int from pg_policies
              where schemaname='public' and tablename='workers'
                and qual = 'true') as workers_policy_wide_open,
            has_column_privilege('anon','public.workers','phone','select')
              as anon_can_read_phone,
            has_column_privilege('anon','public.workers','name','select')
              as anon_can_read_name,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers'
                and column_name in ('terms_version','consent_at','age_confirmed')) as consent_cols,
            (select count(*)::int from information_schema.tables
              where table_schema='public'
                and table_name in ('worker_ratings','worker_reports','contact_requests')) as new_tables,
            (select count(*)::int from information_schema.routines
              where routine_schema='public'
                and routine_name in ('phone_taken','request_worker_contact','admin_queue',
                                     'admin_reports','purge_expired_data','pin_is_published')) as new_functions,
            (select count(*)::int from pg_proc p
              join pg_namespace n on n.oid=p.pronamespace
             where n.nspname='public' and p.proname='rate_worker' and p.pronargs=2) as old_unlimited_rate_fn,
            (select count(*)::int from information_schema.routines r
              join information_schema.parameters pa
                on pa.specific_name = r.specific_name
             where r.routine_schema='public' and r.routine_name='search_workers'
               and pa.parameter_mode='OUT' and pa.parameter_name='phone') as search_still_returns_phone,
            (select count(*)::int from public.worker_reports where not handled) as open_reports
          HSQL
          jq -Rs '{query: .}' /tmp/harden.sql > /tmp/h.json
          code=$(curl -sS -o /tmp/harden.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query -d @/tmp/h.json)
          note "verify hardening: HTTP $code — $(head -c 1200 /tmp/harden.json)"
          [ "$code" = "200" ] || [ "$code" = "201" ] || exit 1
          # these two are warnings, not failures: only the owner can fix them
          if grep -q '"admin_pin_still_published_change_it":true' /tmp/harden.json; then
            note "WARNING: the admin PIN is still the one published in this repo. See DEPLOY.md, Job 0."
          fi
          if grep -q '"cars_pin_still_published_change_it":true' /tmp/harden.json; then
            note "WARNING: the Budget Cars owner PIN is still the published one. See DEPLOY.md, Job 0."
          fi
          # these are failures: they mean the migration did not take
          for bad in '"anon_can_read_phone":true' '"workers_policy_wide_open":1' '"search_still_returns_phone":1' '"old_unlimited_rate_fn":1'; do
            if grep -q "$bad" /tmp/harden.json; then
              note "ERROR: hardening not applied — $bad"; exit 1
            fi
          done
          # End-to-end photo upload, using the public anon key exactly as the
          # browser does — proves the bucket, its policies and public read all work.
          anon=$(grep -oP 'SUPABASE_ANON_KEY\s*=\s*"\K[^"]+' docs/index.html | head -1)
          base=$(grep -oP 'SUPABASE_URL\s*=\s*"\K[^"]+' docs/index.html | head -1)
          if [ -n "$anon" ] && [ -n "$base" ]; then
            printf '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01' > /tmp/probe.jpg
            head -c 900 /dev/urandom >> /tmp/probe.jpg
            obj="ci-probe-$(date +%s).jpg"
            code=$(curl -sS -o /tmp/up.json -w "%{http_code}" -X POST \
              "$base/storage/v1/object/selfies/$obj" \
              -H "apikey: $anon" -H "Authorization: Bearer $anon" \
              -H "Content-Type: image/jpeg" --data-binary @/tmp/probe.jpg)
            note "upload photo as anon: HTTP $code"
            code=$(curl -sS -o /tmp/down.jpg -w "%{http_code}" "$base/storage/v1/object/public/selfies/$obj")
            same=$(cmp -s /tmp/probe.jpg /tmp/down.jpg && echo yes || echo no)
            note "read it back publicly: HTTP $code — byte-identical: $same"
            # a plain-text file must be refused by the mime allow-list
            echo "not an image" > /tmp/bad.txt
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              "$base/storage/v1/object/selfies/ci-probe-bad.txt" \
              -H "apikey: $anon" -H "Authorization: Bearer $anon" \
              -H "Content-Type: text/plain" --data-binary @/tmp/bad.txt)
            note "non-image upload refused (want 4xx): HTTP $code"
          else
            note "WARN: could not read anon key from docs/index.html — upload probe skipped"
          fi

          note "SUCCESS: Nearse database is live"

      - name: Commit status report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/kaamsetu-setup-status.txt
          git commit -m "Nearse DB setup status" || echo "nothing to commit"
          git push || true
