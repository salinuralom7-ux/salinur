name: Studio transcribe
# The editing session can't download speech models, so GitHub's runner
# transcribes studio/projects/<video>/transcribe/input.flac (audio only) with
# faster-whisper large-v3 and commits transcript.json/.txt next to it.

on:
  push:
    branches: ["claude/**"]
    paths: ["studio/projects/*/transcribe/input.flac"]

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper
      - name: Transcribe every input without a transcript
        run: |
          for f in studio/projects/*/transcribe/input.flac; do
            d=$(dirname "$f")
            [ -f "$d/transcript.json" ] && continue
            python3 studio/tools/transcribe.py "$f" "$d" large-v3
          done
      - name: Commit transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/projects/*/transcribe/transcript.*
          git diff --cached --quiet || { git commit -qm "Transcripts from GitHub runner"; git push; }
