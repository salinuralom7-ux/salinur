name: Studio lipsync
# AI talking-face test: Wav2Lip + GFPGAN on CPU for short clips (studio/projects/*/lipsync/face.mp4 + audio.wav).
on:
  push:
    branches: ["claude/**"]
    paths: ["studio/projects/*/lipsync/audio.wav", ".github/workflows/studio-lipsync.yml"]
permissions:
  contents: write
jobs:
  lipsync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy<1.24" "opencv-python<4.9" "librosa==0.9.2" scipy tqdm numba huggingface_hub gfpgan basicsr facexlib
          git clone -q https://github.com/Rudrabha/Wav2Lip
          sed -i 's/librosa.filters.mel(hp.sample_rate, hp.n_fft, n_mels=hp.num_mels,/librosa.filters.mel(sr=hp.sample_rate, n_fft=hp.n_fft, n_mels=hp.num_mels,/' Wav2Lip/audio.py
          grep -n "filters.mel" Wav2Lip/audio.py
      - name: Lip-sync
        run: |
          for d in studio/projects/*/lipsync; do
            [ -f "$d/out_ai.mp4" ] && continue
            python studio/tools/lipsync_runner.py "$d"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f studio/projects/*/lipsync/out_*.mp4
          git diff --cached --quiet || { git commit -qm "Lip-sync test output from GitHub runner"; for i in 1 2 3 4; do git pull -q --rebase && git push && break; sleep 5; done; }
