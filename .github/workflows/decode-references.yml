name: Decode studio reference videos
# The cloud editing session can't reach YouTube, so GitHub's runner does the
# downloading. Runs studio/tools/decode_all_pending.sh and pushes the frames,
# cut lists, loudness stats and transcripts (not the videos themselves) to the
# studio-reference-data branch, where the editing session reads them.

on:
  workflow_dispatch:
  push:
    branches: [claude/video-studio-setup, main]
    paths: [".github/workflows/decode-references.yml", "studio/references/REFERENCE_LINKS.md", "studio/tools/decode_reference.sh"]

permissions:
  contents: write

concurrency: decode-references

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install -q -U yt-dlp faster-whisper
      - name: Decode pending references
        working-directory: studio
        run: tools/decode_all_pending.sh 2>&1 | tee references/decode-log.txt
      - name: Push results to studio-reference-data
        working-directory: studio/references
        run: |
          out=$(mktemp -d)
          for d in */; do
            mkdir -p "$out/$d"
            cp -r "$d"frames "$d"scenes "$out/$d" 2>/dev/null || true
            cp "$d"*.txt "$d"*.json "$d"*.mp3 "$d"*.webp "$d"*.jpg "$out/$d" 2>/dev/null || true
          done
          cp decode-log.txt "$out/"
          cd "$out"
          git init -q -b studio-reference-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Reference decode $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" studio-reference-data
