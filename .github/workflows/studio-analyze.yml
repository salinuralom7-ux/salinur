name: Studio analyze references
# Splits each reference's audio into voice / music+SFX (Demucs) and transcribes it,
# so the editing session can measure music and SFX levels. Models download here,
# not in the session. Commits stems (opus) + transcript next to the input.

on:
  push:
    branches: ["claude/**"]
    paths: ["studio/references/*/analyze_in.opus", ".github/workflows/studio-analyze.yml"]

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install -q demucs faster-whisper soundfile
      - name: Separate and transcribe
        run: |
          for f in studio/references/*/analyze_in.opus; do
            d=$(dirname "$f")
            [ -f "$d/stem_music.opus" ] && continue
            ffmpeg -loglevel error -y -i "$f" -ar 44100 -ac 2 /tmp/in.wav
            python3 -m demucs --two-stems vocals -n htdemucs -o /tmp/sep /tmp/in.wav
            ffmpeg -loglevel error -y -i /tmp/sep/htdemucs/in/no_vocals.wav -c:a libopus -b:a 112k "$d/stem_music.opus"
            ffmpeg -loglevel error -y -i /tmp/sep/htdemucs/in/vocals.wav -c:a libopus -b:a 96k "$d/stem_voice.opus"
            python3 studio/tools/transcribe.py "$f" "$d" large-v3
            rm -rf /tmp/sep
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f studio/references/*/stem_*.opus studio/references/*/transcript.*
          git diff --cached --quiet || { git commit -qm "Reference stems and transcripts from GitHub runner"; for i in 1 2 3 4; do git pull -q --rebase && git push && break; sleep 5; done; }
