name: Set up the MySheher database
# One-time: creates the Repto tables/functions in the existing Supabase
# project. Reads the Supabase access token from the repo secret
# SUPABASE_TOKEN. Writes a sanitized status report to
# .github/mysheher-setup-status.txt (never the token). Removed after use.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/setup-mysheher-db.yml", "docs/supabase-workers-setup.sql"]

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the MySheher schema on Supabase
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          set -uo pipefail
          R=.github/mysheher-setup-status.txt
          note(){ echo "$1" | tee -a "$R"; }
          : > "$R"
          note "run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ -z "${SB_TOKEN:-}" ]; then
            note "ERROR: SUPABASE_TOKEN secret is empty or missing (check the secret name spelling)"
            exit 1
          fi
          note "secret: present (${#SB_TOKEN} chars)"
          echo "::add-mask::$SB_TOKEN"
          api=https://api.supabase.com/v1
          hdr=(-H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json")

          code=$(curl -sS -o /tmp/projects.json -w "%{http_code}" "${hdr[@]}" $api/projects)
          note "list projects: HTTP $code"
          if [ "$code" != "200" ]; then
            note "ERROR: token rejected or API unreachable. Body: $(head -c 300 /tmp/projects.json)"
            exit 1
          fi
          # The Supabase project is still called "budget-cars" in the account —
          # a name from before any of this settled, not a leftover brand in the
          # code. Renaming it in Supabase used to break every run here, because
          # one exact string was matched and nothing else. So both names are
          # accepted: "mysheher" wins if it exists, "budget-cars" answers until
          # somebody renames it, and the rename can happen on any afternoon
          # without touching this file or coordinating with a deploy.
          ref=$(jq -r '[.[] | select(.name=="mysheher" or .name=="MySheher")][0].id // empty' /tmp/projects.json)
          [ -z "$ref" ] && ref=$(jq -r '[.[] | select(.name=="budget-cars")][0].id // empty' /tmp/projects.json)
          if [ -z "$ref" ]; then
            note "ERROR: no project named 'mysheher' or 'budget-cars'. Projects: $(jq -r '[.[].name] | join(\", \")' /tmp/projects.json)"
            exit 1
          fi
          note "project: $ref"

          jq -Rs '{query:.}' docs/supabase-workers-setup.sql > /tmp/q.json
          code=$(curl -sS -o /tmp/sql-out.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query -d @/tmp/q.json)
          note "run SQL: HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            note "ERROR running SQL: $(head -c 500 /tmp/sql-out.json)"
            exit 1
          fi

          code=$(curl -sS -o /tmp/count.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query \
            -d '{"query":"select count(*)::int as n from public.workers"}')
          note "verify workers table: HTTP $code — $(head -c 200 /tmp/count.json)"
          [ "$code" = "200" ] || [ "$code" = "201" ] || exit 1

          # confirm the migration actually shaped the schema, not just that the SQL parsed
          cat > /tmp/verify.sql <<'VSQL'
          select
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers'
                and column_name in ('status','phone_verified','review_note')) as new_worker_cols,
            (select count(*)::int from information_schema.routines
              where routine_schema='public'
                and routine_name in ('admin_set_status','admin_set_require_otp')) as new_functions,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers' and column_name='email') as email_leaked_to_public,
            (select require_phone_otp from public.nearse_config where id=1) as require_phone_otp,
            (select count(*)::int from public.workers where status='approved') as approved_now,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='worker_secrets'
                and column_name in ('email','wa_code')) as private_cols,
            (select count(*)::int from information_schema.routines
              where routine_schema='public' and routine_name='admin_wa_codes') as wa_fn,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers' and column_name='wa_code') as wa_code_leaked,
            (select count(*)::int from information_schema.routines
              where routine_schema='public' and routine_name='delete_worker') as delete_fn,
            (select count(*)::int from pg_trigger
              where tgname = 'workers_coarse_location_trg') as coarse_loc_trigger,
            (select count(*)::int from public.workers
              where lat is not null and lat <> round(lat::numeric, 3)::double precision) as precise_coords_left,
            (select count(*)::int from storage.buckets where id='selfies' and public) as selfie_bucket,
            (select file_size_limit from storage.buckets where id='selfies') as selfie_size_cap,
            (select count(*)::int from pg_policies
              where schemaname='storage' and tablename='objects'
                and policyname in ('selfies are publicly readable','anyone may upload a selfie')) as selfie_policies,
            (select count(*)::int from public.workers where selfie like 'data:%') as photos_still_in_db,
            (select count(*)::int from information_schema.routines
              where routine_schema='public' and routine_name='search_workers') as search_fn,
            (select count(*)::int from pg_indexes
              where schemaname='public' and indexname='workers_browse_idx') as browse_index,
            (select count(*)::int from public.search_workers(26.1445, 91.7362, null, null, null, 'Guwahati', 20, 0)) as search_page_rows,
            (select count(*)::int from public.workers where status='approved' and available) as approved_and_available,
            (select coalesce(string_agg(distinct encode(convert_to(coalesce(city,'~NULL~'),'UTF8'),'hex'), ' | '), '(none)')
               from public.workers) as cities_hex,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers' and column_name='thumb') as thumb_col,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers' and column_name in ('thumb','selfie')) as photo_cols,
            (select count(*)::int from public.service_rates) as rate_bands,
            (select min_price || '-' || max_price from public.service_rates where skill='Carpenter') as carpenter_band,
            (select count(*)::int from information_schema.routines
              where routine_schema='public' and routine_name='check_rate_bands') as band_fn,
            (select count(*)::int from public.workers w, jsonb_array_elements(w.skills) s
               join public.service_rates r on r.skill = s->>'skill'
              where (s->>'price')::numeric < r.min_price or (s->>'price')::numeric > r.max_price) as live_rates_out_of_band
          VSQL
          jq -Rs '{query: .}' /tmp/verify.sql > /tmp/v.json
          code=$(curl -sS -o /tmp/verify.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query -d @/tmp/v.json)
          note "verify migration: HTTP $code — $(head -c 900 /tmp/verify.json)"
          [ "$code" = "200" ] || [ "$code" = "201" ] || exit 1

          # Migration 10, checked against the real database rather than a
          # local copy. Every one of these was a way in before it was closed.
          cat > /tmp/harden.sql <<'HSQL'
          select
            (select public.pin_is_published(pin_hash) from public.nearse_admin where id=1)
              as admin_pin_STILL_PUBLISHED_change_it,
            (select count(*)::int from pg_policies
              where schemaname='public' and tablename='workers'
                and qual like '%approved%') as workers_policy_approved_only,
            (select count(*)::int from pg_policies
              where schemaname='public' and tablename='workers'
                and qual = 'true') as workers_policy_wide_open,
            has_column_privilege('anon','public.workers','phone','select')
              as anon_can_read_phone,
            has_column_privilege('anon','public.workers','name','select')
              as anon_can_read_name,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='workers'
                and column_name in ('terms_version','consent_at','age_confirmed')) as consent_cols,
            (select count(*)::int from information_schema.tables
              where table_schema='public'
                and table_name in ('worker_ratings','worker_reports','contact_requests')) as new_tables,
            (select count(*)::int from information_schema.routines
              where routine_schema='public'
                and routine_name in ('phone_taken','request_worker_contact','admin_queue',
                                     'admin_reports','purge_expired_data','pin_is_published')) as new_functions,
            (select count(*)::int from pg_proc p
              join pg_namespace n on n.oid=p.pronamespace
             where n.nspname='public' and p.proname='rate_worker' and p.pronargs=2) as old_unlimited_rate_fn,
            (select count(*)::int from information_schema.routines r
              join information_schema.parameters pa
                on pa.specific_name = r.specific_name
             where r.routine_schema='public' and r.routine_name='search_workers'
               and pa.parameter_mode='OUT' and pa.parameter_name='phone') as search_still_returns_phone,
            (select count(*)::int from public.worker_reports where not handled) as open_reports,
            -- Deleting a profile: this is the one that was silently broken in
            -- production. Supabase forbids a direct delete on storage.objects,
            -- so any function still doing it takes the whole erasure down.
            (select count(*)::int from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public'
                and p.prosrc ~* 'delete[[:space:]]+from[[:space:]]+storage') as fns_deleting_storage_directly,
            (select count(*)::int from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and p.proname='delete_worker') as delete_worker_overloads,
            (select pg_get_function_identity_arguments(p.oid) from pg_proc p
              join pg_namespace n on n.oid=p.pronamespace
             where n.nspname='public' and p.proname='delete_worker' limit 1) as delete_worker_args,
            (select count(*)::int from pg_policies
              where schemaname='storage' and tablename='objects'
                and cmd='DELETE') as storage_delete_policy,
            (select count(*)::int from information_schema.tables
              where table_schema='public' and table_name='deleted_media') as media_queue,
            (select count(*)::int from information_schema.routines
              where routine_schema='public'
                and routine_name in ('worker_auth','worker_session_start','auth_guard',
                                     'admin_session_start','verify_worker_id','start_thread')) as session_fns,
            -- Migration 20. Without these the price bands are bypassable by
            -- inventing a skill name, and a profile can be any size and point
            -- its photo anywhere.
            (select count(*)::int from information_schema.routines
              where routine_schema='public'
                and routine_name in ('clean_worker_data','clean_photo_url')) as validation_fns,
            (select count(*)::int from public.pricing_units) as pricing_units
          HSQL
          jq -Rs '{query: .}' /tmp/harden.sql > /tmp/h.json
          code=$(curl -sS -o /tmp/harden.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query -d @/tmp/h.json)
          note "verify hardening: HTTP $code — $(head -c 1200 /tmp/harden.json)"

          # ---- notifications, both directions ----
          # The queue and the triggers are the whole feature. If a trigger is
          # missing nothing is ever queued, and the failure is silent: the app
          # looks fine and no notification ever arrives.
          cat > /tmp/push.sql <<'PSQL'
          select
            (select count(*)::int from information_schema.tables
              where table_schema='public'
                and table_name in ('worker_push','customer_push','push_outbox')) as push_tables,
            (select count(*)::int from information_schema.routines
              where routine_schema='public'
                and routine_name in ('save_push_subscription','save_customer_push',
                                     'enqueue_push','enqueue_customer_push',
                                     'claim_push','mark_push_sent','mark_push_failed',
                                     'drop_push_endpoint','purge_push_outbox')) as push_fns,
            (select count(*)::int from pg_trigger
              where not tgisinternal
                and tgname in ('threads_push_trg','messages_push_trg','workers_push_status_trg',
                               'threads_customer_push_trg','messages_worker_push_trg')) as push_triggers,
            -- a queue row must name exactly one recipient
            (select count(*)::int from pg_constraint
              where conname='push_outbox_one_recipient') as recipient_constraint,
            -- claim_push must hand the sender an endpoint for both kinds
            (select count(*)::int from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and p.proname='claim_push'
                and p.prosrc ~ 'customer_push') as claim_covers_customers,
            -- a customer is anon, so this one has to survive the lockdown
            (select has_function_privilege('anon',
               'public.save_customer_push(text,uuid,text,text,text)', 'execute')) as anon_may_subscribe,
            -- the outbox should not be silently piling up unsent
            (select count(*)::int from public.push_outbox where sent_at is null) as unsent,
            (select count(*)::int from public.push_outbox where attempts >= 5) as given_up,
            (select coalesce(max(left(last_error, 120)), 'none')
               from public.push_outbox where last_error is not null) as last_push_error,
            (select count(*)::int from public.worker_push) as workers_subscribed,
            (select count(*)::int from public.customer_push) as customers_subscribed,
            (select coalesce(nullif(vapid_public,''), 'NOT SET — see DEPLOY.md Job 0.5') is distinct from
                    'NOT SET — see DEPLOY.md Job 0.5' from public.nearse_config where id=1) as vapid_key_set,
            -- what actually wakes the sender. An alert sits in the queue until
            -- something calls the function, and this is the part that was
            -- silently missing while everything else reported healthy.
            (select count(*)::int from pg_extension where extname='pg_net')  as pg_net,
            (select count(*)::int from pg_extension where extname='pg_cron') as pg_cron,
            (select count(*)::int from pg_trigger
              where not tgisinternal and tgname='push_outbox_poke_trg')      as poke_trigger,
            (select coalesce(btrim(push_url),'') <> '' from public.nearse_config where id=1) as sender_url_known,
            (select coalesce(max(extract(epoch from (now()-created_at))/60),0)::int
               from public.push_outbox where sent_at is null)                as oldest_unsent_mins,
            -- Everything scheduled. pg_cron only arrived today, so until now
            -- none of these jobs existed: retention, dispatch backstop, the
            -- push sweep and both purges were all written and never running.
            (select coalesce(string_agg(jobname, ' ' order by jobname), 'NONE')
               from cron.job)                                                as cron_jobs
          PSQL
          jq -Rs '{query: .}' /tmp/push.sql > /tmp/p.json
          code=$(curl -sS -o /tmp/push.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query -d @/tmp/p.json)
          note "verify push: HTTP $code — $(head -c 1200 /tmp/push.json)"

          # ---- the push keys, generated here and never seen by anyone ----
          # These were the last manual step in the whole setup, and the one
          # that had blocked every notification the app queues: "run npx
          # web-push on a laptop, paste the public key into SQL, set three
          # secrets with the Supabase CLI." That is four tools and a computer,
          # and it never happened.
          #
          # The token that already applies the schema and deploys the sender
          # can also write project secrets, so it does. The private key is
          # generated on the runner, masked out of the logs before anything
          # else touches it, posted straight to Supabase, and never printed,
          # never committed, never sent to anybody. Nobody has to hold it.
          #
          # Generated ONCE. Rotating a VAPID key invalidates every push
          # subscription already issued against it — every worker who has
          # tapped "turn on alerts" would silently stop receiving them — so if
          # a key is already there this step keeps its hands off.
          have=$(curl -sS "${hdr[@]}" "$api/projects/$ref/secrets" \
                   | jq -r '[.[] | select(.name=="VAPID_PRIVATE")] | length')
          if [ "$have" != "0" ]; then
            note "push keys: already set — left alone (rotating one would cut off every phone already subscribed)"
          else
            npm i --silent --no-save web-push@3.6.7 >/dev/null 2>&1
            node -e "const w=require('web-push');const k=w.generateVAPIDKeys();console.log(JSON.stringify(k))" > /tmp/vapid.json
            VAPID_PUB=$(jq -r .publicKey  /tmp/vapid.json)
            VAPID_PRIV=$(jq -r .privateKey /tmp/vapid.json)
            # masked before it can appear in any later command's echo
            echo "::add-mask::$VAPID_PRIV"
            rm -f /tmp/vapid.json

            jq -n --arg pub "$VAPID_PUB" --arg priv "$VAPID_PRIV" \
              '[{name:"VAPID_PUBLIC",value:$pub},
                {name:"VAPID_PRIVATE",value:$priv},
                {name:"VAPID_SUBJECT",value:"mailto:info@mysheher.com"}]' > /tmp/sec.json
            code=$(curl -sS -o /tmp/secres.json -w "%{http_code}" "${hdr[@]}" \
                     -X POST "$api/projects/$ref/secrets" -d @/tmp/sec.json)
            note "push keys: stored in Supabase — HTTP $code"

            # the browser needs the PUBLIC key to subscribe at all, and it
            # reads it from the database, not from the function
            printf "update public.nearse_config set vapid_public = %s where id = 1;" \
              "'"'"'$VAPID_PUB'"'"'" > /tmp/vp.sql
            jq -Rs '{query: .}' /tmp/vp.sql > /tmp/vp.json
            code=$(curl -sS -o /tmp/vpres.json -w "%{http_code}" "${hdr[@]}" \
                     -X POST "$api/projects/$ref/database/query" -d @/tmp/vp.json)
            note "push keys: public key published to the app — HTTP $code"
            note "push keys: the private key was never printed, committed or sent anywhere"
          fi

          # ---- deploy the sender ----
          # This used to be "paste 100 lines into the dashboard editor", which
          # is a wall for anyone without a laptop — and impossible for someone
          # locked out of the dashboard entirely. The token that already
          # applies the schema can deploy a function just as well, so the
          # sender ships with everything else and cannot drift from the
          # repository.
          FN=supabase/functions/push/index.ts
          if [ ! -f "$FN" ]; then
            note "sender: $FN is missing from the repository"
          else
            jq -n --arg slug push --arg name push --arg body "$(cat $FN)" \
              '{slug:$slug, name:$name, body:$body, verify_jwt:false}' > /tmp/fn.json

            code=$(curl -sS -o /tmp/fnres.json -w "%{http_code}" "${hdr[@]}" \
                     -X POST "$api/projects/$ref/functions" -d @/tmp/fn.json)
            if [ "$code" = "409" ] || [ "$code" = "400" ]; then
              # already there: update it in place
              code=$(curl -sS -o /tmp/fnres.json -w "%{http_code}" "${hdr[@]}" \
                       -X PATCH "$api/projects/$ref/functions/push" -d @/tmp/fn.json)
              note "sender: updated existing function — HTTP $code"
            else
              note "sender: created — HTTP $code"
            fi
            case "$code" in
              2*) note "sender: deployed as https://$ref.supabase.co/functions/v1/push" ;;
              *)  note "sender: DEPLOY FAILED — $(head -c 400 /tmp/fnres.json)" ;;
            esac

            # tell the database where to poke, so the trigger from Migration 29
            # has somewhere to send to
            printf 'update public.nearse_config set push_url = %s where id = 1;' \
              "'https://$ref.supabase.co/functions/v1/push'" > /tmp/url.sql
            jq -Rs '{query: .}' /tmp/url.sql > /tmp/u.json
            code=$(curl -sS -o /tmp/url.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query -d @/tmp/u.json)
            note "sender: url recorded for the trigger — HTTP $code"

            # and give it a nudge, which also proves it answers
            code=$(curl -sS -o /tmp/ping.json -w "%{http_code}" -X POST "https://$ref.supabase.co/functions/v1/push" -H "Content-Type: application/json" -d '{}')
            note "sender: test call — HTTP $code — $(head -c 300 /tmp/ping.json)"
          fi

          # ---- and the one-time-code sender, the same way ----
          # A forgotten PIN is recovered with a code sent to the number on the
          # account. If this function is not deployed the codes sit in
          # otp_outbox and nobody can get back into anything, so it ships with
          # the schema rather than being a step somebody has to remember.
          OFN=supabase/functions/otp/index.ts
          if [ ! -f "$OFN" ]; then
            note "otp sender: $OFN is missing from the repository"
          else
            jq -n --arg slug otp --arg name otp --arg body "$(cat $OFN)" \
              '{slug:$slug, name:$name, body:$body, verify_jwt:false}' > /tmp/ofn.json
            ocode=$(curl -sS -o /tmp/ofnres.json -w "%{http_code}" "${hdr[@]}" \
                      -X POST "$api/projects/$ref/functions" -d @/tmp/ofn.json)
            if [ "$ocode" = "409" ] || [ "$ocode" = "400" ]; then
              ocode=$(curl -sS -o /tmp/ofnres.json -w "%{http_code}" "${hdr[@]}" \
                        -X PATCH "$api/projects/$ref/functions/otp" -d @/tmp/ofn.json)
              note "otp sender: updated existing function — HTTP $ocode"
            else
              note "otp sender: created — HTTP $ocode"
            fi
            case "$ocode" in
              2*) note "otp sender: deployed as https://$ref.supabase.co/functions/v1/otp" ;;
              *)  note "otp sender: DEPLOY FAILED — $(head -c 400 /tmp/ofnres.json)" ;;
            esac
            # A 500 here is the expected answer until a provider's secrets are
            # set, and it says which ones are missing — so it is reported, not
            # treated as a failure of the deploy.
            ocode=$(curl -sS -o /tmp/optest.json -w "%{http_code}" -X POST "https://$ref.supabase.co/functions/v1/otp" -H "Content-Type: application/json" -d '{}')
            note "otp sender: test call — HTTP $ocode — $(head -c 300 /tmp/optest.json)"
          fi
          [ "$code" = "200" ] || [ "$code" = "201" ] || exit 1
          # these two are warnings, not failures: only the owner can fix them
          if grep -q '"admin_pin_still_published_change_it":true' /tmp/harden.json; then
            note "WARNING: the admin PIN is still the one published in this repo. See DEPLOY.md, Job 0."
          fi
          # these are failures: they mean the migration did not take
          # A profile that cannot be deleted breaks the right to erasure and the
          # Play Store listing, and it failed silently once already.
          if grep -q '"fns_deleting_storage_directly":0' /tmp/harden.json; then
            note "OK: nothing deletes from storage.objects in SQL any more"
          fi
          if ! grep -q '"storage_delete_policy":1' /tmp/harden.json; then
            note "WARNING: no DELETE policy on storage.objects — profiles still delete, photos wait for the nightly sweep"
          fi
          for bad in '"anon_can_read_phone":true' '"workers_policy_wide_open":1' '"search_still_returns_phone":1' '"old_unlimited_rate_fn":1' '"fns_deleting_storage_directly":1' '"delete_worker_overloads":0' '"media_queue":0' '"validation_fns":0' '"validation_fns":1'; do
            if grep -q "$bad" /tmp/harden.json; then
              note "ERROR: hardening not applied — $bad"; exit 1
            fi
          done

          # The price bands only hold if every service the app offers has a row
          # in service_rates: check_rate_bands lets an unknown skill through, so
          # a service missing here is a service with no floor and no ceiling.
          # Name the difference rather than only reporting that there is one.
          cat > /tmp/rates.sql <<'RSQL'
          select coalesce(string_agg(skill, chr(10) order by skill), '') as skills,
                 coalesce((select string_agg(unit, chr(10) order by unit) from public.pricing_units), '') as units
            from public.service_rates
          RSQL
          jq -Rs '{query: .}' /tmp/rates.sql > /tmp/r.json
          code=$(curl -sS -o /tmp/rates.json -w "%{http_code}" "${hdr[@]}" -X POST $api/projects/$ref/database/query -d @/tmp/r.json)
          note "read service_rates: HTTP $code"
          jq -r '.[0].skills' /tmp/rates.json > /tmp/db-skills.txt
          jq -r '.[0].units'  /tmp/rates.json > /tmp/db-units.txt
          node tests/catalogue-drift.js > /tmp/drift.txt 2>&1 || true
          while IFS= read -r line; do note "$line"; done < /tmp/drift.txt
          if grep -q '^VERDICT unpriced' /tmp/drift.txt; then
            note "ERROR: the services listed as UNPRICED above have no floor and no"
            note "       ceiling, so any rate at all can be published for them. Add"
            note "       them to Migration 9 in docs/supabase-workers-setup.sql."
            exit 1
          fi
          if grep -q '^VERDICT units' /tmp/drift.txt; then
            note "ERROR: a unit the app offers is missing from pricing_units, so"
            note "       choosing it is refused on save."
            exit 1
          fi
          # End-to-end photo upload, using the public anon key exactly as the
          # browser does — proves the bucket, its policies and public read all work.
          anon=$(grep -oP 'SUPABASE_ANON_KEY\s*=\s*"\K[^"]+' docs/index.html | head -1)
          base=$(grep -oP 'SUPABASE_URL\s*=\s*"\K[^"]+' docs/index.html | head -1)
          if [ -n "$anon" ] && [ -n "$base" ]; then
            printf '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01' > /tmp/probe.jpg
            head -c 900 /dev/urandom >> /tmp/probe.jpg
            obj="ci-probe-$(date +%s).jpg"
            code=$(curl -sS -o /tmp/up.json -w "%{http_code}" -X POST \
              "$base/storage/v1/object/selfies/$obj" \
              -H "apikey: $anon" -H "Authorization: Bearer $anon" \
              -H "Content-Type: image/jpeg" --data-binary @/tmp/probe.jpg)
            note "upload photo as anon: HTTP $code"
            code=$(curl -sS -o /tmp/down.jpg -w "%{http_code}" "$base/storage/v1/object/public/selfies/$obj")
            same=$(cmp -s /tmp/probe.jpg /tmp/down.jpg && echo yes || echo no)
            note "read it back publicly: HTTP $code — byte-identical: $same"
            # a plain-text file must be refused by the mime allow-list
            echo "not an image" > /tmp/bad.txt
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              "$base/storage/v1/object/selfies/ci-probe-bad.txt" \
              -H "apikey: $anon" -H "Authorization: Bearer $anon" \
              -H "Content-Type: text/plain" --data-binary @/tmp/bad.txt)
            note "non-image upload refused (want 4xx): HTTP $code"
          else
            note "WARN: could not read anon key from docs/index.html — upload probe skipped"
          fi

          note "SUCCESS: Repto database is live"

      - name: Commit status report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/mysheher-setup-status.txt
          git commit -m "MySheher DB setup status" || echo "nothing to commit"
          git push || true
